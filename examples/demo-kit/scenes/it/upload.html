<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Documenti — Acme Portal</title>
  <link rel="stylesheet" href="../../shared/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="logo">Acme Portal</div>
    <a href="#">Bacheca</a>
    <a href="#" class="active" id="nav-documents">Documenti</a>
    <a href="#">Pratiche</a>
    <a href="#">Clienti</a>
    <a href="#">Impostazioni</a>
  </aside>
  <div class="main">
    <header class="topbar" id="topbar">
      <input placeholder="Cerca…" aria-label="Search">
      <div class="avatar">MR</div>
    </header>
    <main class="content">
      <h1>Documenti</h1>
      <p class="sub">Carica e organizza i documenti delle tue pratiche.</p>
      <section class="card" id="upload-card">
        <div class="dropzone" id="dropzone">
          <strong>Trascina qui i tuoi file</strong>
          oppure
          <br>
          <button class="btn secondary" id="choose-file" type="button">Scegli un file</button>
        </div>
        <div class="file-row" id="file-row" hidden>
          <span class="badge">PDF</span>
          <span class="name" id="file-name">contract-2024.pdf</span>
          <span class="size">1.2 MB</span>
        </div>
        <div class="field" id="title-field" hidden>
          <label for="doc-title">Titolo del documento</label>
          <input id="doc-title" placeholder="es. Contratto di servizio">
        </div>
        <div class="progress" id="progress" hidden><div id="progress-bar"></div></div>
        <button class="btn disabled" id="upload-btn" type="button">Carica</button>
        <div class="toast" id="toast" hidden>✓ Caricamento completato: il documento è nel tuo archivio.</div>
      </section>
    </main>
  </div>
</body>
</html>
