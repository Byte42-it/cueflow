<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Terminal</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1280px;height:720px;overflow:hidden;background:#1b1d23;font:22px/1.7 ui-monospace,Consolas,monospace;color:#e6e6e6}
.top{background:#2b2e36;padding:12px 24px;font:16px system-ui;color:#aab}
.term{padding:28px 40px}
.line{white-space:pre-wrap;min-height:38px}
.p{color:#6fcf97}.c{color:#fff;display:inline-block;min-width:10px;min-height:1.4em;vertical-align:bottom}.o{color:#8b93a1}

</style></head><body>
<div class="top">Terminal</div>
<div class="term">
<div class="line"><span class="p">you@laptop:~$ </span><span class="c" id="c-clone"></span></div>
<div class="line"><span class="p">you@laptop:~$ </span><span class="c" id="c-cd"></span></div>
<div class="line"><span class="p">you@laptop:~/cueflow$ </span><span class="c" id="c-install"></span></div>
<div class="line"><span class="p">you@laptop:~/cueflow$ </span><span class="c" id="c-studio"></span></div>
<div class="line o" id="o-studio" hidden>Cueflow Studio: http://localhost:4310/</div>
<div class="line"><span class="p">you@laptop:~/my-project$ </span><span class="c" id="c-own"></span></div>
</div>
</body></html>
